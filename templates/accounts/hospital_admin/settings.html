{% extends "accounts/hospital_admin/base.html" %}
{% load static %}

{% block title %}NHIMS - Configuration{% endblock %}

{% block extra_css %}
<style>
.page-header{margin-bottom:1.5rem}
.page-header h1{font-size:1.65rem;font-weight:700;color:var(--text);margin:0 0 .25rem}
.page-header p{color:#64748b;margin:0;font-size:.92rem}
.config-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem}
.config-card{background:#fff;border-radius:14px;border:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.05);padding:1.4rem}
.config-card-header{display:flex;align-items:center;gap:10px;margin-bottom:1.3rem}
.config-card-header .icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#dbeafe;color:#2563eb}
.config-card-header h2{font-size:1.05rem;font-weight:600;color:var(--text);margin:0}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-size:.84rem;font-weight:600;color:#334155;margin-bottom:5px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 13px;border:1px solid var(--border);border-radius:9px;font-size:.88rem;background:#f8fafc;color:var(--text);outline:none;transition:border-color .15s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#93c5fd;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.form-group textarea{min-height:78px;resize:vertical}
.toggle-row{display:flex;justify-content:space-between;align-items:center;margin-top:1.1rem;padding-top:.9rem;border-top:1px solid var(--border)}
.toggle-row label{font-size:.88rem;font-weight:600;color:#334155;margin:0}
.switch{position:relative;width:44px;height:24px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;inset:0;background:#cbd5e1;border-radius:24px;transition:.2s}
.slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + .slider{background:#2563eb}
.switch input:checked + .slider:before{transform:translateX(20px)}
.save-row{margin-top:1.4rem;display:flex;justify-content:flex-end}
.btn-save{background:#2563eb;color:#fff;border:none;padding:.65rem 1.4rem;border-radius:9px;font-weight:600;font-size:.88rem;cursor:pointer;display:inline-flex;align-items:center;gap:7px;box-shadow:0 4px 12px rgba(37,99,235,.22)}
.btn-save:hover{background:#1d4ed8}
@media(max-width:900px){.config-grid{grid-template-columns:1fr}}
</style>
{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Configuration</h1>
    <p>Manage hospital settings and preferences</p>
</div>

<form method="post">
    {% csrf_token %}
    <div class="config-grid">
        <!-- Hospital Profile (per hospital) -->
        <div class="config-card">
            <div class="config-card-header">
                <div class="icon">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/>
                    </svg>
                </div>
                <h2>Hospital Profile</h2>
            </div>
            <div class="form-group">
                <label>Hospital Name</label>
                <input type="text" name="hospital_name" value="{{ hospital.name|default:'' }}" required>
            </div>
            <div class="form-group">
                <label>Hospital Code</label>
                <input type="text" name="hospital_code" value="{{ hospital.code|default:'' }}" {% if not hospital %}required{% endif %}>
            </div>
            <div class="form-group">
                <label>Hospital Email</label>
                <input type="email" name="hospital_email" value="{{ hospital.email|default:'' }}">
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="text" name="hospital_phone" value="{{ hospital.phone|default:'' }}">
            </div>
            <div class="form-group">
                <label>Address</label>
                <textarea name="hospital_address">{{ hospital.address|default:'' }}</textarea>
            </div>
        </div>

        <!-- Preferences (global) -->
        <div class="config-card">
            <div class="config-card-header">
                <div class="icon">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
                    </svg>
                </div>
                <h2>Preferences</h2>
            </div>
            <div class="form-group">
                <label>Timezone</label>
                <select name="timezone">
                    {% for value, label in settings.TIMEZONE_CHOICES %}
                    <option value="{{ value }}" {% if settings.timezone == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Currency</label>
                <select name="currency">
                    {% for value, label in settings.CURRENCY_CHOICES %}
                    <option value="{{ value }}" {% if settings.currency == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Date Format</label>
                <select name="date_format">
                    {% for value, label in settings.DATE_FORMAT_CHOICES %}
                    <option value="{{ value }}" {% if settings.date_format == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="toggle-row">
                <label>Maintenance Mode</label>
                <label class="switch">
                    <input type="checkbox" name="maintenance_mode" {% if settings.maintenance_mode %}checked{% endif %}>
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <div class="save-row">
        <button type="submit" class="btn-save">
            <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                <path d="M20 6L9 17l-5-5"/>
            </svg>
            Save Settings
        </button>
    </div>
</form>
{% endblock %}
